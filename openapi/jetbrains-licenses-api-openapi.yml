openapi: 3.2.0
info:
  title: JetBrains Marketplace Licenses API
  description: The JetBrains Marketplace API provides programmatic access to the plugin marketplace for JetBrains IDEs. It allows listing plugins by IDE compatibility, searching for plugins, uploading new plugins and updates, downloading plugin files, and checking plugin licenses. The API serves both plugin developers and consumers who need to integrate with the JetBrains plugin ecosystem.
  version: 1.0.0
  contact:
    name: JetBrains
    url: https://plugins.jetbrains.com/docs/marketplace/api-reference.html
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://plugins.jetbrains.com
  description: JetBrains Marketplace
security: []
tags:
- name: Licenses
  description: License checking operations
paths:
  /api/marketplace/plugin/{productCode}/license:
    get:
      summary: JetBrains Check Plugin License
      description: Checks the license status for a plugin.
      operationId: checkPluginLicense
      tags:
      - Licenses
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
      - name: email
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response with license info
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Marketplace token for authenticated operations
