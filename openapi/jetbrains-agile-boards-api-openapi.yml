openapi: 3.2.0
info:
  title: JetBrains YouTrack REST Agile Boards API
  description: The YouTrack REST API lets you perform programmatic actions in the issue tracker, including creating, modifying, and querying issues, managing projects, agile boards, work items, and more. The API uses JSON format and supports both permanent token and OAuth 2.0 authentication. A Postman collection is available for interactive exploration.
  version: 2024.1.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/youtrack/devportal/youtrack-rest-api.html
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{instance}.youtrack.cloud/api
  description: YouTrack Cloud
  variables:
    instance:
      default: myinstance
      description: Your YouTrack instance name
security:
- bearerAuth: []
tags:
- name: Agile Boards
  description: Agile board management
paths:
  /agiles:
    get:
      summary: JetBrains List Agile Boards
      description: Returns a list of agile boards.
      operationId: listAgileBoards
      tags:
      - Agile Boards
      responses:
        '200':
          description: Successful response with agile board list
  /agiles/{agileId}:
    get:
      summary: JetBrains Get Agile Board
      description: Returns details of a specific agile board.
      operationId: getAgileBoard
      tags:
      - Agile Boards
      parameters:
      - name: agileId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with agile board details
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Permanent token or OAuth 2.0 Bearer Token
