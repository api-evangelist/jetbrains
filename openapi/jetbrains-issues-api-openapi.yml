openapi: 3.2.0
info:
  title: JetBrains YouTrack REST Issues API
  description: The YouTrack REST API lets you perform programmatic actions in the issue tracker, including creating, modifying, and querying issues, managing projects, agile boards, work items, and more. The API uses JSON format and supports both permanent token and OAuth 2.0 authentication. A Postman collection is available for interactive exploration.
  version: 2024.1.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/youtrack/devportal/youtrack-rest-api.html
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{instance}.youtrack.cloud/api
  description: YouTrack Cloud
  variables:
    instance:
      default: myinstance
      description: Your YouTrack instance name
security:
- bearerAuth: []
tags:
- name: Issues
  description: Issue management operations
paths:
  /issues:
    get:
      summary: JetBrains List Issues
      description: Returns a list of issues matching the query.
      operationId: listIssues
      tags:
      - Issues
      parameters:
      - name: query
        in: query
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
      - name: $skip
        in: query
        schema:
          type: integer
      - name: $top
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Successful response with issue list
    post:
      summary: JetBrains Create Issue
      description: Creates a new issue.
      operationId: createIssue
      tags:
      - Issues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Issue created successfully
  /issues/{issueId}:
    get:
      summary: JetBrains Get Issue
      description: Returns details of a specific issue.
      operationId: getIssue
      tags:
      - Issues
      parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response with issue details
    post:
      summary: JetBrains Update Issue
      description: Updates an existing issue.
      operationId: updateIssue
      tags:
      - Issues
      parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Issue updated successfully
    delete:
      summary: JetBrains Delete Issue
      description: Deletes an issue.
      operationId: deleteIssue
      tags:
      - Issues
      parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Issue deleted successfully
  /issues/{issueId}/comments:
    get:
      summary: JetBrains List Issue Comments
      description: Returns comments for an issue.
      operationId: listIssueComments
      tags:
      - Issues
      parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with comment list
    post:
      summary: JetBrains Add Issue Comment
      description: Adds a comment to an issue.
      operationId: addIssueComment
      tags:
      - Issues
      parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Comment added successfully
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Permanent token or OAuth 2.0 Bearer Token
