openapi: 3.2.0
info:
  title: JetBrains TeamCity REST Build Queue API
  description: The TeamCity REST API provides programmatic access to TeamCity CI/CD server functionality. It allows management of projects, build configurations, builds, agents, VCS roots, users, and more. The API uses locators for flexible filtering and supports both JSON and XML formats. The full API specification is available via the /app/rest/swagger.json endpoint on any TeamCity instance.
  version: 2024.12.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/teamcity/rest/teamcity-rest-api-documentation.html
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{server}/app/rest
  description: TeamCity Server
  variables:
    server:
      default: teamcity.example.com
      description: Your TeamCity server hostname
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Build Queue
  description: Build queue management
paths:
  /buildQueue:
    get:
      summary: JetBrains List Build Queue
      description: Returns builds currently in the build queue.
      operationId: listBuildQueue
      tags:
      - Build Queue
      parameters:
      - name: locator
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response with build queue
    post:
      summary: JetBrains Trigger Build
      description: Adds a build to the queue (triggers a build).
      operationId: triggerBuild
      tags:
      - Build Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Build triggered successfully
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Username and password authentication
