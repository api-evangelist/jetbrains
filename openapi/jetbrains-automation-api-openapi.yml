openapi: 3.2.0
info:
  title: JetBrains Space HTTP Automation API
  description: The JetBrains Space HTTP API provides programmatic access to Space functionality including projects, teams, chats, documents, code reviews, packages, automation jobs, and more. The API uses JSON format and supports OAuth 2.0 authentication. An HTTP API playground is available within Space for interactive exploration.
  version: 2024.1.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/space/
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{organization}.jetbrains.space/api/http
  description: JetBrains Space Cloud
  variables:
    organization:
      default: myorg
      description: Your Space organization name
security:
- bearerAuth: []
tags:
- name: Automation
  description: Automation and CI/CD operations
paths:
  /projects/{projectId}/automation/jobs:
    get:
      summary: JetBrains List Automation Jobs
      description: Returns automation jobs for a project.
      operationId: listAutomationJobs
      tags:
      - Automation
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with automation job list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 Bearer Token or permanent token
