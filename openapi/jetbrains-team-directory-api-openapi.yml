openapi: 3.2.0
info:
  title: JetBrains Space HTTP Team Directory API
  description: The JetBrains Space HTTP API provides programmatic access to Space functionality including projects, teams, chats, documents, code reviews, packages, automation jobs, and more. The API uses JSON format and supports OAuth 2.0 authentication. An HTTP API playground is available within Space for interactive exploration.
  version: 2024.1.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/space/
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{organization}.jetbrains.space/api/http
  description: JetBrains Space Cloud
  variables:
    organization:
      default: myorg
      description: Your Space organization name
security:
- bearerAuth: []
tags:
- name: Team Directory
  description: Team and member management
paths:
  /team-directory/profiles:
    get:
      summary: JetBrains List Team Members
      description: Returns a list of team member profiles.
      operationId: listTeamMembers
      tags:
      - Team Directory
      responses:
        '200':
          description: Successful response with member list
  /team-directory/teams:
    get:
      summary: JetBrains List Teams
      description: Returns a list of teams in the organization.
      operationId: listTeams
      tags:
      - Team Directory
      responses:
        '200':
          description: Successful response with team list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 Bearer Token or permanent token
