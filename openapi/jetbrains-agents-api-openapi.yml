openapi: 3.2.0
info:
  title: JetBrains TeamCity REST Agents API
  description: The TeamCity REST API provides programmatic access to TeamCity CI/CD server functionality. It allows management of projects, build configurations, builds, agents, VCS roots, users, and more. The API uses locators for flexible filtering and supports both JSON and XML formats. The full API specification is available via the /app/rest/swagger.json endpoint on any TeamCity instance.
  version: 2024.12.0
  contact:
    name: JetBrains
    url: https://www.jetbrains.com/help/teamcity/rest/teamcity-rest-api-documentation.html
  license:
    name: Proprietary
    url: https://www.jetbrains.com/legal/
servers:
- url: https://{server}/app/rest
  description: TeamCity Server
  variables:
    server:
      default: teamcity.example.com
      description: Your TeamCity server hostname
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Agents
  description: Build agent management
paths:
  /agents:
    get:
      summary: JetBrains List Agents
      description: Returns a list of build agents.
      operationId: listAgents
      tags:
      - Agents
      parameters:
      - name: locator
        in: query
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response with agent list
  /agents/{agentLocator}:
    get:
      summary: JetBrains Get Agent
      description: Returns details of a specific build agent.
      operationId: getAgent
      tags:
      - Agents
      parameters:
      - name: agentLocator
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with agent details
  /agents/{agentLocator}/enabledInfo:
    put:
      summary: JetBrains Enable/Disable Agent
      description: Enables or disables a build agent.
      operationId: setAgentEnabled
      tags:
      - Agents
      parameters:
      - name: agentLocator
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Agent status updated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Username and password authentication
